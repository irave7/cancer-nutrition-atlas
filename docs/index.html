<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>癌症营养全周期管理图谱</title>
<style>
:root {
  color-scheme: light;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  --text: #172337;
  --muted: #506174;
  --secondary: #5b6d81;
  --accent: #135ac8;
  --active: #0949ac;
  --accent-fill: #e5efff;
  --purple: #6649a2;
  --purple-fill: #f0eafa;
  --mint: #156c60;
  --mint-fill: #e6f5ee;
  --amber: #855120;
  --amber-fill: #f9efdf;
  --line: #d3dce9;
  --line-subtle: #e4eaf2;
  --shell: #f8fafd;
  --panel: #ffffff;
  --soft: #f3f6fb;
  --glass: rgba(251,253,255,.82);
  --sidebar: rgba(231,239,250,.76);
  --shadow: 0 20px 55px #1f3e631a, 0 2px 8px #2e536015;

  --ocean: #e8f3fb;
  --land: #c6dbe2;
  --land-edge: #a8c3d0;
  --gridline: #c7dce9;
  --map-edge: #d7e2ef;
}
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: dark;
    --text: #e8f0fc;
    --muted: #b5c5d8;
    --secondary: #a6bbcf;
    --accent: #9dc4ff;
    --active: #c1d8ff;
    --accent-fill: #243c67;
    --purple: #ded0fa;
    --purple-fill: #42345d;
    --mint: #95e0c8;
    --mint-fill: #21453d;
    --amber: #f4cb93;
    --amber-fill: #4e3825;
    --line: #3a4a62;
    --line-subtle: #2b3850;
    --shell: #1a2536;
    --panel: #202c40;
    --soft: #26344a;
    --glass: rgba(30,42,61,.88);
    --sidebar: rgba(33,48,73,.85);
    --shadow: 0 20px 60px #0407117d;
    --small-shadow: 0 2px 5px #070e1c80, inset 0 1px 0 #fff1;
    --wallpaper: radial-gradient(ellipse at 5% 4%,#243a5b 0,transparent 50%), radial-gradient(ellipse at 96% 7%,#203f47 0,transparent 45%), #111927;
    --ocean: #1b3451;
    --land: #436076;
    --land-edge: #7094a3;
    --gridline: #385677;
    --map-edge: #3a526c;
  }
}
* { box-sizing: border-box; }
body { margin:0; min-width: 320px; background:var(--wallpaper); color:var(--text); min-height:100vh; }
button,input,select { font:inherit; color:inherit; }
button,select { cursor:pointer; }
button { border:0; background:none; }
button:disabled { cursor:default; opacity:.43; }
a { color:var(--accent); text-underline-offset:3px; }
button:focus-visible, a:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible, [tabindex]:focus-visible { outline:3px solid var(--accent); outline-offset:3px; }
:where(h1,h2,h3,h4,p,ol,ul) { margin:0; }
[hidden] { display:none !important; }
.sr-only,.skip:not(:focus) { position:absolute; width:1px; height:1px; overflow:hidden; clip-path:inset(50%); white-space:nowrap; }
.skip:focus { position:fixed; left:1rem; top:1rem; z-index:10; padding:10px; background:var(--panel); }
i[data-icon] { display:inline-grid; place-items:center; flex:none; height:1.2em; width:1.2em; font-style:normal; }
i[data-icon] svg { width:100%; height:100%; stroke:currentColor; fill:none; stroke-width:1.7; stroke-linecap:round; stroke-linejoin:round; }
kbd { display:inline-flex; min-width:1.45em; justify-content:center; border:1px solid var(--line); border-radius:5px; color:var(--secondary); padding:1px 4px; font-weight:600; line-height:1.3; font-size:.72rem; white-space:nowrap; }
.app-window { --window-inset:clamp(8px,1.6vw,25px); --page-gutter:clamp(13px,2vw,26px); --bar-height:58px; --nav-inset:12px; display:grid; grid-template-columns:216px minmax(0,1fr); max-width:1760px; margin:var(--window-inset) auto; width:calc(100% - 2 * var(--window-inset)); min-height:calc(100dvh - 2 * var(--window-inset)); overflow:clip; border:1px solid var(--line); border-radius:25px; background:var(--shell); box-shadow:var(--shadow); }
.app-window.sidebar-hidden,.app-window.presenting { grid-template-columns:minmax(0,1fr); }
.sidebar { min-width:0; align-self:stretch; background:var(--sidebar); border-inline-end:1px solid var(--line); backdrop-filter:blur(26px) saturate(1.15); }
.sidebar-inner { position:sticky; top:0; height:calc(100dvh - 2 * var(--window-inset) - 2px); display:flex; flex-direction:column; }
.sidebar #nav { flex:1; min-height:0; overflow:auto; scrollbar-width:thin; padding:16px var(--nav-inset) 6px; }
.sidebar-hidden .sidebar,.presenting .sidebar { display:none; }
.brand { display:flex; gap:8px; align-items:center; flex:none; min-height:var(--bar-height); padding:6px calc(var(--nav-inset) + 7px); border-bottom:1px solid var(--line); }
.brand-icon { display:grid; place-items:center; width:36px; height:36px; border-radius:11px; color:white; background:linear-gradient(155deg,#4099fb,#1462cc 58%,#17499e); border:1px solid #5b9ee8; box-shadow:0 4px 11px #215aab45, inset 0 1px 2px #cfe7fc85; font-size:1.2rem; flex:none; }
.brand strong,.brand small { display:block; }
.brand strong { letter-spacing:-.02em; white-space:nowrap; }
.brand small { color:var(--secondary); font-size:.77rem; margin-top:3px; }
.nav-group + .nav-group { margin-top:16px; }
.nav-group h2 { font-size:.72rem; color:var(--secondary); letter-spacing:.08em; padding:0 8px 5px 33px; }
.nav-item { display:grid; grid-template-columns:17px minmax(0,1fr) auto; align-items:center; gap:8px; text-align:left; width:100%; min-height:36px; padding:6px 8px; border-radius:9px; font-size:.88rem; font-weight:610; margin-bottom:3px; white-space:nowrap; color:var(--text); }

.nav-item span,.side-command span { min-width:0; overflow:hidden; text-overflow:ellipsis; }
.nav-item small { color:var(--secondary); font-size:.73rem; font-variant-numeric:tabular-nums; }
.sidebar-foot { flex:none; margin:0 var(--nav-inset); padding:9px 0 11px; border-top:1px solid var(--line); display:grid; gap:2px; }
.foot-date,.side-command { display:grid; grid-template-columns:17px minmax(0,1fr) auto; align-items:center; gap:8px; padding:7px 8px; color:var(--muted); text-align:left; font-size:.75rem; white-space:nowrap; }
.side-command { border-radius:8px; }
.foot-date i { color:var(--mint); }
.workspace { min-width:0; }
.toolbar { position:sticky; top:0; z-index:5; display:flex; justify-content:space-between; align-items:center; gap:10px; min-height:var(--bar-height); padding:8px var(--page-gutter); background:var(--glass); border-bottom:1px solid var(--line); backdrop-filter:blur(25px) saturate(1.3); }
.tool-leading,.tool-trailing,.history-group { display:flex; align-items:center; gap:5px; min-width:0; }
.history-group { gap:0; padding:2px; border:1px solid var(--line); background:var(--glass); border-radius:20px; margin:0 6px; }
.icon-button { display:inline-grid; place-items:center; min-width:34px; height:34px; padding:0 7px; border-radius:50%; font-size:1.02rem; color:var(--muted); flex:none; }
.history-group .icon-button { width:28px; min-width:28px; height:27px; padding:0; }
.icon-button:hover:not(:disabled) { background:var(--accent-fill); color:var(--accent); }
.presentation-toggle { border:1px solid var(--line); background:var(--glass); box-shadow:var(--small-shadow); }
.presentation-toggle[aria-pressed="true"] { color:var(--active); background:var(--accent-fill); }
.crumb { font-size:.86rem; font-weight:660; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.toolbar-search { display:flex; align-items:center; gap:7px; min-height:34px; padding:5px 9px; border:1px solid var(--line); border-radius:18px; background:var(--glass); color:var(--muted); font-size:.83rem; white-space:nowrap; box-shadow:var(--small-shadow); }
.toolbar-search:hover { background:var(--accent-fill); }
.mobile-nav { display:none; }
.sidebar-hidden .mobile-nav,.presenting .mobile-nav { display:block; }
.sidebar-hidden .crumb,.presenting .crumb { display:none; }
.mobile-nav select { border:1px solid var(--line); border-radius:9px; background:var(--panel); max-width:100%; min-height:33px; padding:4px 5px; font-size:.83rem; }
.screen-inner { padding:19px var(--page-gutter) var(--page-gutter); }
.screen-head { display:flex; justify-content:space-between; align-items:flex-end; gap:15px; margin-bottom:15px; }
.screen-head h1 { font-size:clamp(1.45rem,2.35vw,2.23rem); line-height:1.2; letter-spacing:-.045em; margin-bottom:6px; }
.screen-head p { font-size:.9rem; line-height:1.57; color:var(--muted); }
.screen-kicker { display:inline-flex; align-items:center; gap:6px; color:var(--accent); font-size:.77rem; font-weight:720; margin-bottom:6px; letter-spacing:.05em; }
.stats { display:flex; justify-content:flex-end; gap:7px; flex-wrap:wrap; flex:none; }
.stat { min-width:75px; padding:6px 9px; border-radius:11px; border:1px solid var(--line); background:var(--glass); box-shadow:var(--small-shadow); }
.stat strong { display:block; color:var(--active); font-size:1.31rem; white-space:nowrap; font-weight:740; line-height:1.18; font-variant-numeric:tabular-nums; }
.stat span { color:var(--secondary); font-size:.71rem; white-space:nowrap; }
.pane { background:var(--panel); border:1px solid var(--line); border-radius:16px; min-width:0; }
.filter-bar { background:var(--glass); border:1px solid var(--line); border-radius:13px; display:flex; gap:7px; flex-wrap:wrap; align-items:center; padding:7px 9px; margin-bottom:12px; backdrop-filter:blur(20px); }
.segmented { display:inline-flex; gap:2px; align-items:center; padding:3px; background:var(--soft); border:1px solid var(--line); border-radius:10px; flex:none; }
.segmented button { min-height:27px; display:flex; align-items:center; justify-content:center; gap:5px; padding:4px 8px; border-radius:7px; font-size:.81rem; white-space:nowrap; color:var(--muted); }
.segmented button:hover { color:var(--accent); }
.segmented button[aria-pressed="true"] { background:var(--panel); color:var(--active); box-shadow:var(--small-shadow); font-weight:680; }
.filter { display:inline-flex; gap:4px; align-items:center; min-width:0; }
.filter > span { color:var(--secondary); font-size:.76rem; white-space:nowrap; }
select.control,.text-input { border:1px solid var(--line); color:var(--text); background:var(--panel); border-radius:8px; padding:6px 6px; min-width:0; font-size:.82rem; min-height:32px; }
.filter.reset { margin-left:auto; }
.case-text-filter { position:relative; }
.case-text-filter i { position:absolute; inset-inline-start:7px; color:var(--secondary); font-size:.79rem; }
.case-text-filter input { padding-inline-start:24px; width:142px; }
.extra-filters { display:flex; gap:8px; flex-wrap:wrap; align-items:center; flex-basis:100%; border-top:1px solid var(--line-subtle); padding-top:7px; }
.subtle-button { color:var(--accent); border-radius:8px; font-size:.79rem; padding:6px 7px; min-height:32px; white-space:nowrap; }
.subtle-button:hover { background:var(--accent-fill); }
.atlas-grid { display:grid; grid-template-columns:minmax(0,1.74fr) minmax(305px,1fr); align-items:start; gap:12px; }
.map-pane { overflow:hidden; }
.map-top { display:flex; justify-content:space-between; gap:8px; align-items:center; padding:11px 13px; }
.map-top h2 { font-size:1rem; }
.map-top small { color:var(--secondary); display:block; font-size:.74rem; margin-top:3px; }
.map-tools { display:flex; align-items:center; gap:2px; border:1px solid var(--line); border-radius:20px; padding:2px; background:var(--glass); flex:none; }
.map-tools .icon-button { width:28px; min-width:28px; height:27px; padding:0; font-size:.88rem; }
.map-zoom { font-size:.72rem; color:var(--muted); min-width:34px; text-align:center; font-variant-numeric:tabular-nums; }
.map-viewport { position:relative; overflow:hidden; border-block:1px solid var(--map-edge); background:var(--ocean); isolation:isolate; touch-action:pan-y; }
.map-viewport.is-zoomed { cursor:grab; touch-action:none; }
.map-viewport.dragging { cursor:grabbing; user-select:none; }
.map-world,.map-cn { position:relative; transform-origin:center; }
.map-cn { aspect-ratio:1080/695; max-width:100%; background:#f6fbff; }
.map-world { aspect-ratio:2/1; }
.map-cn img,.map-world svg.world-svg { position:absolute; inset:0; width:100%; height:100%; display:block; user-select:none; pointer-events:none; }
.map-cn img { object-fit:contain; }
.map-world svg.world-svg { fill:var(--land); stroke:var(--land-edge); stroke-width:.6; }
.world-svg .graticule { stroke:var(--gridline); fill:none; stroke-width:.75; }
.map-pin { position:absolute; left:var(--x); top:var(--y); transform:translate(-50%,-50%) scale(var(--inverse-scale,1)); z-index:2; border:1.5px solid white; background:#1a61ac; color:white; border-radius:50%; width:25px; height:25px; display:grid; place-items:center; padding:0; font-size:.72rem; font-weight:740; line-height:1; box-shadow:0 1px 5px #1e456b90; }
.map-pin.world-pin { background:#694f9c; width:25px; height:25px; }
.map-pin.zero { background:#647b8e; opacity:.72; }
.map-pin:hover,.map-pin:focus-visible,.map-pin[aria-pressed="true"] { z-index:3; }
.map-pin:hover,.map-pin:focus-visible { box-shadow:0 0 0 4px #2876d856, 0 2px 5px #22466a8c; }
.map-pin[aria-pressed="true"] { background:#073c86; border-color:#fff; box-shadow:0 0 0 4px #277dec73, 0 2px 7px #132f5eab; }
.map-pin.world-pin[aria-pressed="true"] { background:#4c317e; box-shadow:0 0 0 4px #7c62ae7b,0 2px 7px #33214caa; }
.map-pin.world-pin.focus-near { outline:2px solid #9dbbf1; outline-offset:1px; }
.pin-count { display:grid; place-items:center; color:#174688; background:#f4f8ff; border:1px solid #5984c0; border-radius:9px; min-width:13px; height:13px; padding:0 2px; position:absolute; left:calc(100% - 3px); top:-5px; font-size:8px; line-height:1; }
.map-caption { background:var(--panel); color:var(--secondary); padding:8px 12px; font-size:.72rem; line-height:1.45; display:flex; justify-content:space-between; gap:7px; flex-wrap:wrap; }
.map-caption a { white-space:nowrap; }
.case-collection { margin-top:10px; padding:10px; }
.case-collection h2 { font-size:.9rem; margin-bottom:7px; }
.case-list { display:grid; grid-template-columns:1fr; gap:5px; list-style:none; padding:0; }
.case-collection.map-collection .case-list { grid-template-columns:1fr 1fr; }
.result-list { padding:12px; }
.result-list > h2 { margin-bottom:8px; font-size:1rem; }
.result-row { display:flex; align-items:flex-start; gap:8px; width:100%; padding:8px; text-align:left; border:1px solid transparent; border-radius:9px; line-height:1.43; }
.result-row:hover { background:var(--soft); }
.result-row[aria-current="true"] { border-color:color-mix(in srgb,var(--accent) 25%,var(--line)); background:var(--accent-fill); }
.result-row > i { color:var(--accent); margin-top:2px; }
.result-row strong,.result-row small { display:block; }
.result-row strong { font-size:.85rem; color:var(--text); }
.result-row small { color:var(--secondary); font-size:.72rem; margin-top:2px; }
.result-row .row-text { min-width:0; flex:1; }
.result-row .row-end { margin-left:auto; }
.result-empty { padding:16px 12px; font-size:.88rem; line-height:1.6; color:var(--muted); }
.inline-badge { display:inline-flex; align-items:center; gap:4px; border-radius:6px; background:var(--soft); color:var(--muted); padding:3px 6px; font-size:.72rem; line-height:1.3; font-weight:630; }
.inline-badge.blue { color:var(--active); background:var(--accent-fill); }
.inline-badge.purple { color:var(--purple); background:var(--purple-fill); }
.inline-badge.mint { color:var(--mint); background:var(--mint-fill); }
.inline-badge.amber { color:var(--amber); background:var(--amber-fill); }
.badges { display:flex; gap:4px; flex-wrap:wrap; align-items:center; }
.inspector { align-self:start; position:sticky; top:68px; max-height:calc(100dvh - 81px); overflow:auto; scrollbar-width:thin; scrollbar-gutter:stable; min-height:290px; }
.inspector-top { padding:13px 14px 10px; border-bottom:1px solid var(--line-subtle); }
.inspector-titlebar { display:flex; justify-content:space-between; align-items:start; gap:5px; }
.inspector-titlebar .icon-button { width:28px; min-width:28px; height:29px; padding:0; }
.inspector-titlebar .icon-button[aria-pressed=true] { background:var(--accent-fill); color:var(--active); }
.inspector-top h2 { font-size:clamp(1.09rem,1.55vw,1.42rem); line-height:1.34; letter-spacing:-.031em; margin:7px 0 5px; word-break:break-word; }
.meta { color:var(--secondary); font-size:.77rem; line-height:1.58; overflow-wrap:anywhere; }
.inspector-nav { padding:7px 10px; display:flex; gap:3px; background:var(--glass); border-bottom:1px solid var(--line-subtle); position:sticky; top:0; z-index:1; backdrop-filter:blur(20px); }
.inspector-nav button { flex:1; min-height:30px; white-space:nowrap; font-size:.79rem; padding:5px 5px; border-radius:7px; color:var(--muted); }
.inspector-nav button[aria-pressed=true] { background:var(--accent-fill); color:var(--active); font-weight:700; }
.inspector-content { padding:12px 14px 15px; font-size:.9rem; line-height:1.63; }
.inspector-content p { line-height:1.65; margin-bottom:9px; }
.inspector-content h3 { font-size:.94rem; margin:12px 0 6px; }
.inspector-content h3:first-child { margin-top:0; }
.inspector-content .summary { font-size:.9rem; color:var(--text); }
.effect-note { background:var(--amber-fill); color:var(--amber); border-radius:8px; padding:8px 9px; font-size:.79rem; line-height:1.55; margin:8px 0; }
.actions { display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin-top:10px; }
.button { display:inline-flex; align-items:center; gap:5px; justify-content:center; min-height:33px; border:1px solid var(--line); border-radius:8px; background:var(--panel); color:var(--accent); padding:5px 8px; font-size:.78rem; font-weight:660; line-height:1.36; text-decoration:none; text-align:left; }
.button:hover { background:var(--accent-fill); }
.button.primary { background:#1b60ca; color:#fff; border-color:#1b60ca; }

.path-strip { display:flex; gap:4px; flex-wrap:wrap; }

.timeline { list-style:none; margin:4px 0 0; padding:0; }
.timeline li { position:relative; padding:0 0 11px 19px; color:var(--text); font-size:.82rem; line-height:1.55; }

.metrics-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:6px; margin:7px 0; }

.source-list { padding-left:1.05em; font-size:.8rem; line-height:1.55; }

.inspector-back { display:flex; align-items:center; gap:4px; color:var(--accent); font-size:.78rem; padding:4px 0; margin-bottom:4px; text-align:left; }

-w","sourceTitle":"Effective nutritional intervention improves the health-related quality of life (HRQL) of undernourished children with cancer: results of a randomized, controlled phase 3 trial","summary":"在中度或重度营养不良的肿瘤患儿中，比较标准营养治疗和标准治疗加即食治疗性食品两种模式，观察6周健康相关生活质量。","scope":"印度儿科癌症门诊及病区入组的中重度营养不良肿瘤患儿，260人随机分组。以牵头机构所在地为地图锚点。","category":"research","evidence":"开放标签三期随机试验。HUI3较高，HUI2差异无统计学显著性。结果适用于该研究中重度营养不良人群和短期观察。","steps":["assessment","intervention","monitoring"],"cancers":["儿童肿瘤"],"process":[{"stage":"assessment","detail":"在儿科肿瘤门诊和病区识别符合中重度营养不良标准且适合入组的患儿，记录基线生活质量。"},{"stage":"intervention","detail":"比较标准营养治疗加即食治疗性食品与标准营养治疗。"},{"stage":"monitoring","detail":"6周后以 HUI2 和 HUI3 两类健康效用量表进行复评。"}],"metrics":[{"label":"入组人数","value":"260人","context":"1:1随机分组"},{"label":"6周HUI3中位分","value":"0.90 vs 0.79","context":"加用即食治疗性食品组对标准组，P = 0.009"},{"label":"6周HUI2中位分","value":"0.90 vs 0.89","context":"相同组间比较，P = 0.317"}],"sources":[],"evidenceType":"study","links":[{"docId":"clinical-nutrition-2024","clauseId":"priority","reason":"参照比较儿童肿瘤重点人群的营养管理"},{"docId":"clinical-department-2022","clauseId":"assess24","reason":"参照比较风险发现后的进一步评估及干预"}]},{"id":"world-icesp","province":null,"country":"巴西","countryCode":"BR","coordinates":[-46.67,-23.557],"institution":"圣保罗州癌症研究所（ICESP）","city":"圣保罗","title":"管饲患者出院前照护者实操培训与院外咨询","date":"2016","sourceType":"癌症中心官网项目与热线说明","url":"https://icesp.org.br/ensinando-a-cuidar/","sourceTitle":"Ensinando a Cuidar","summary":"通过2016年开始的患者照护者教学项目，团队对有管饲等照护需求的患者和家庭开展出院前指导及练习。院方另提供院外营养电话咨询。","scope":"癌症研究所住院及门诊患者与指定的家庭照护者，按需要提供营养管路等居家照护训练。","category":"home","evidence":"两项均有机构服务页面。热线适用于本院患者。服务材料未公布家庭管饲并发症或再入院的变化。","steps":["assessment","intervention","discharge","coordination"],"cancers":["多癌种"],"process":[{"stage":"assessment","detail":"在住院或门诊识别有特定照护需要的人，邀请家庭照护者参加教育。"},{"stage":"intervention","detail":"营养、护理、康复及心理社会专业共同提供患者和家庭专属指导。"},{"stage":"discharge","detail":"照护者在院内接受出院后的照护训练，可在模拟场景练习喂养管等护理操作。"},{"stage":"coordination","detail":"患者离开医院后可通过机构热线就营养等事务电话咨询。" 建一条照护路径","detail":"从筛查和膳食指导开始，顺着治疗、出院、随访和安宁照护看，每一步都有政策和案例入口。","target":{"type":"section","id":"cycle","label":"查看全周期路径"}},{"title":"准备福建试点或汇报","detail":"先核对本地已有服务，再选择可迁移的外省做法，最后看试点分工和评价指标。","target":{"type":"view","id":"fujian","label":"打开福建应用"}},{"title":"查证据、查原文","detail":"在地图或列表筛案例，在右侧展开对应条款，进入发布机构的全文、附件或研究原文。","target":{"type":"view","id":"policy","label":"打开中国政策库"}}],"cycle":[{"label":"确诊与入院","summary":"在首次就诊、收治或治疗方案变化时识别营养风险。筛查用于分流；有风险时由合适的专业人员进一步评估。","refs":[{"type":"policy","id":"clinical-department-2022","clause":"screen24","label":"筛查工作规范"},{"type":"policy","id":"pg-sga-2017","clause":"schedule","label":"评估时间与复评"}]},{"label":"围治疗期","summary":"把营养目标、干预方式和复评时点写入照护计划。手术、放化疗等阶段的摄入、症状和耐受变化，应反馈给负责团队。","refs":[{"type":"policy","id":"national-cancer-plan","clause":"support","label":"癌症防治行动"},{"type":"case","id":"hunan-radiotherapy","label":"湖南放疗病房"}]},{"label":"离院与交接","summary":"在离院前确认营养状态与现行方案、需要观察的变化、接手团队和下一次联系。随诊或上门渠道和升级路径要能被患者及基层团队找到。","refs":[{"type":"policy","id":"clinical-nutrition-2024","clause":"continuity","label":"连续营养服务"},{"type":"case","id":"bj-shijitan-h2h","label":"北京院家术后支持"}]},{"label":"居家、康复与长期随访","summary":"根据风险和治疗安排计划复评。结合患者可获得的门诊、电话或家庭医生服务，记录摄入和状态变化，对接专科反馈。","refs":[{"type":"policy","id":"national-nutrition-plan","clause":"continuity","label":"医院、社区、家庭衔接"},{"type":"case","id":"js-nj-headneck-triad","label":"江苏三场景路径"}]},{"label":"需要安宁疗护时","summary":"与患者、照护者和团队核对目标，重视进食舒适、口腔与吞咽安全，以及不同干预的负担。安排合适的随访或上门支持。","refs":[{"type":"policy","id":"palliative-2025","clause":"feeding","label":"进食和饮水照护"},{"type":"case","id":"fj-fz-changle-palliative","label":"福州长乐入户个案"}]}],"use":"页面中的政策关联用于追溯同类做法。政策效力看发文机关和适用人群，服务介绍看已披露流程，研究结果看设计、分母和随访时长。"},"fujian":{"title":"福建可以先做什么","subtitle":"从已有院内流程、县域医共体和家医随访中选一条可试点的路径。","thesis":"我建议福建先做一条病例比较集中、院内流程已有基础的路径：由一家有成熟营养病房的医院牵头，和一家县总医院及其基层团队共同验证胃肠肿瘤围术期的营养交接。重点是确定谁接手、谁复评、异常如何回转，再考虑扩到放疗和更多县域。安宁疗护可与既有居家服务单独联动，以舒适和患者意愿为目标。","foundation":[{"title":"省级规划给出了发展方向","detail":"福建卫生健康发展“十五五”规划支持营养专科、综合诊疗和县域肿瘤防治能力。它为跨科协作和延伸服务提供政策基础。","refs":[{"type":"policy","id":"fj-health-15th","clause":"integrated","label":"福建卫生健康“十五五”规划"}]},{"title":"已有转诊与家庭医生对接机制","detail":"省卫健委公开答复披露省、市、县双向转诊平台及基层康复承接。省级家医文件要求有条件的地区通过信息系统把部分出院患者的随访要求交给签约团队。营养专项字段、接单比例和反馈仍待验证。","refs":[{"type":"source","url":"https://wjw.fujian.gov.cn/xxgk/fgwj/zxwj/202507/t20250711_6966464.htm","label":"癌症分级诊疗公开答复"},{"type":"policy","id":"fj-family-doctor-2022","clause":"handoff","label":"家医签约与出院随访"},{"type":"source","url":"https://wjw.fujian.gov.cn/gzcy/zrxx/cjwtjd/kbjy/202604/t20260421_7129683.htm","label":"省肿瘤医院全周期管理入口"}]},{"title":"已有可现场核对的营养案例","detail":"莆田公开胃肠外科风险筛查与阶梯营养支持。闽东公开围术期和出院后随访流程。厦门弘爱公开全院营养风险分类和跨科协作模式。","refs":[{"type":"case","id":"fj-putian-surgical-nutrition","label":"莆田营养诊疗病房"},{"type":"case","id":"fujian-nutrition-ward","label":"宁德闽东医院"},{"type":"case","id":"fj-xm-hongai-risk","label":"厦门弘爱医院"}]}],"actions":[{"title":"让首个病种的筛、评、治能核对","layer":"牵头医院 · 病房","local":"从福建已有的胃肠外科及营养示范病房选牵头科室。把入院筛查、阳性后转评、术前后营养方案和复评时点纳入同一张工作清单。","transfer":"莆田的病房流程提供本地参考，邵逸夫医院的研究可借鉴如何用分母、追加评估率和质控回顾检查执行。","limit":"指标先按参加试点的病区统计，并标明癌种、人群和收治时间窗。全院数字单独记录。","refs":[{"type":"case","id":"fj-putian-surgical-nutrition","label":"莆田院内路径"},{"type":"case","id":"zhejiang-quality","label":"浙江持续质量改进"},{"type":"policy","id":"quality-2026","clause":"assessment","label":"国家营养评估质控目标"}]},{"title":"把营养交接纳入已有转诊和家医流程","layer":"市县医院 · 家庭医生","local":"出院前生成营养交接单，记录最近评估、当前方案、复评时间、联系人和回转条件。利用已有转诊或出院随访渠道流转，由接手团队确认收件，异常经明确入口反馈专科。","transfer":"江苏头颈部放化疗研究的共享档案、社区分层支持和异常转诊可借鉴。先验证福建医共体的现有系统能否承载这些字段和回执。","limit":"家医政策提供一般随访衔接依据。肿瘤营养专项的职责、服务支付和实际覆盖需由参加机构确认。","refs":[{"type":"policy","id":"fj-family-doctor-2022","clause":"handoff","label":"福建出院信息推送要求"},{"type":"case","id":"js-nj-headneck-triad","label":"江苏医院—社区—家庭研究"},{"type":"policy","id":"clinical-nutrition-2024","clause":"continuity","label":"国家连续营养管理条款"}]},{"title":"让居家复评有可执行的安排","layer":"门诊 · 居家","local":"按风险安排营养门诊或电话复评，由患者或家属记下可获得的摄入、体重和耐受变化。用与院内一致的记录项回填，随访人员发现异常时转回原团队。","transfer":"闽东的出院随访提供本地入口。北京世纪坛的纸面或电子摄入日志、出院前指导和固定回访节奏，可拆成低门槛的试点动作。","limit":"随访间隔由试点临床团队依据病种、风险和照护资源确认。外省研究的时间表和效果只适用于其研究范围。","refs":[{"type":"case","id":"fujian-nutrition-ward","label":"闽东出院随访"},{"type":"case","id":"bj-shijitan-h2h","label":"北京胃肠术后院家研究"},{"type":"policy","id":"fj-nutrition-plan","clause":"fj-plan-continuity","label":"福建长期营养管理部署"}]},{"title":"安宁照护单列目标与回访责任","layer":"基层 · 安宁疗护","local":"由现有基层和上级医院团队共同确认患者的进食需求、舒适目标及照护家庭的支持安排。在记录表中写明谁复评、症状恶化怎样联系、各项支持由谁负责。","transfer":"长乐江田镇的公开个案展示了出院后实际到家、评估和连续服务的组织方式。可借鉴上门交接、家属培训及与上级团队的联络。","limit":"公开材料是个案，不提供全市营养服务覆盖率，也不足以推断某种营养支持在其他患者中的适用性。","refs":[{"type":"case","id":"fj-fz-changle-palliative","label":"福州长乐居家安宁个案"},{"type":"policy","id":"palliative-2025","clause":"appetite","label":"厌食评估与照护决策"}]}],"pilot":[{"label":"第 1–2 周","title":"定边界、定角色","detail":"医院营养科与肿瘤外科共同明确入组范围。县总医院、基层团队和营养门诊明确接手方式、复评窗口与回转联系人，并核对原有系统和用量统计口径。"},{"label":"第 3–8 周","title":"跑通一条院家路径","detail":"一条病种路径、一组医院及基层团队、同一张营养交接单。例会检查丢失的回执、计划外转诊和患者反馈，逐周修正流程。"},{"label":"第 9–12 周","title":"看数据后决定扩围","detail":"按病区和风险核对分母、失访、转回及时性及患者负担。具备连续记录和接手能力后，再讨论拓展放疗或更多县域。"}],"metrics":[{"name":"入院风险筛查完成率","definition":"完成筛查人数 ÷ 同期应筛查的试点收治人数","note":"记录入院至筛查时间，按病区、癌种报告。"},{"name":"阳性后评估完成率","definition":"完成进一步营养评估人数 ÷ 筛查阳性人数","note":"注明评估时间窗及未完成原因。"},{"name":"出院交接回执率","definition":"规定时限内收到接手确认人数 ÷ 出院时需跨团队营养交接人数","note":"“已发出”和“接手已确认”分别计数。"},{"name":"计划随访完成率","definition":"在约定时间窗完成营养随访人数 ÷ 到达该随访窗口的应访人数","note":"记录死亡、转院、拒访和失联；报告实际统计口径。"},{"name":"预警回转与患者负担","definition":"记录异常反馈时间、接诊结果、重复联系次数与照护者反馈","note":"配合观察体重或摄入指标变化。分析时带上可测人群和缺失数据。"}],"guardrail":"临床方案、特医食品和收费保障应由参加机构依适用政策和个人情况核对。流程建议、试点时段和评价口径属于图谱作者拟议，福建现有服务以已列原文及机构披露为准。","cost":{"title":"服务经费和支付需要分别核对","detail":"家医与医共体项目可先核对已有预算、服务资质与新增工时。符合条件的患者可核查家庭病床渠道。福建量表文件对护理营养筛查有计价规定，特医食品的使用、收费和医保支付也需要按各自政策逐项核实。","refs":[{"type":"policy","id":"fj-home-beds","clause":"eligibility","label":"家庭病床适用条件"},{"type":"policy","id":"fj-clinical-scale-2025","clause":"care-charge","label":"护理筛查计价"},{"type":"policy","id":"fsmp-use-2026","clause":"dietfirst","label":"特医食品院内使用"}]}},"flagshipIntro":"从本图谱已核验的公开资料中，按可验证的实施深度、跨场景连续性、评价方法与可迁移性选读。各案例代表不同方向，展示顺序按场景组织。","flagships":[{"id":"zhejiang-quality","lens":"院级质控与扩面","why":"把筛查、追加评估、干预与复评写进信息系统，并公布数万级口径的筛查分母、基线和复测结果。","bounds":"2021 至 2024 年院级流程指标，支持学习质量改进方法。"},{"id":"tianjin-one-stop","lens":"四场景数字衔接","why":"把门诊、日间医疗、住院及居家纳入同一流程。病区收到筛查提示，离院后仍可记录膳食及复诊。","bounds":"路径及规模来自机构会议报告，按来源所述时段与人次解读。"},{"id":"sichuan-remote-monitor","lens":"多癌种居家延续","why":"把多癌种营养日志、远程预警和居家反馈接入院内分层干预。院方另披露消化道肿瘤家庭营养服务按县、乡、村三级模式推广。","bounds":"院方介绍给出了推广模式，具体县域和病例覆盖未披露。"},{"id":"hunan-radiotherapy","lens":"放疗阶段复评","why":"放疗示范病房公开筛评、团队协作和干预复核，并明确离院后第 1 周、第 1 个月及第 3 个月的联系节点。","bounds":"适用于原研究披露的放疗示范病房人群。"},{"id":"js-nj-headneck-triad","lens":"医院、社区、家庭协作","why":"在头颈部放化疗人群中研究共享档案、家庭记录、社区支持和转诊，并公布干预与对照组的统计口径。","bounds":"为病种特定的研究流程，迁移需核对福建县域团队与信息系统。"},{"id":"bj-shijitan-h2h","lens":"胃肠术后院家随访","why":"在早期院内营养管理试点基础上，2026 年公开研究把术后家庭计划、摄入记录、每周视频回访及复评节点纳入同一流程。","bounds":"研究纳入 152 例老年胃肠道肿瘤患者，需结合单中心、短期随访和干预组合解读。"}]},"chinaMap":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAYEBQYFBAYGBQYHBwYIChAKCgkJChQODwwQFxQYGBcUFhYaHSUfGhsjHBYWICwgIyYnKSopGR8tMC0oMCUoKSj/2wBDAQcHBwoIChMKChMoGhYaKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCgoKCj/wAARCAK3BDgDASIAAhEBAxEB/8QAHAABAAIDAQEBAAAAAAAAAAAAAAUGAQQHAwII/8QAYBAAAQMDAwEDBgUPCAUICQQDAQIDBAAFEQYSITETQVEHFCJhcYEykZShsQgVFhcjMzQ2QlJWcnSywTd1krPR0uHiJFNic/AmNUNlgpWi8SVERVVXZIOTwkZUY4TDoyf/xAAaAQEAAwEBAQAAAAAAAAAAAAAAAQIEAwUG/8QAKREAAgIBBAIDAAIDAQEBAAAAAAECEQMEEiExE0EiMlEFFCMzYUJxFf/aAAwDAQACEQMRAD8A/VNKUoBSlKAUpSgFKUoBSlKAUr4DyCjclQIxkEd9VLydatXq23TJaoIiNxpbkVOHN+8oOCenFAXClfJUCMA1WYOsbZMu90tsfzp2ZbHEtyUIYUraVAlJyO44PxUBaKVELv0dCSVR5oABJJjqGPmrTg6vtUzUi7E0t9NxSwJJbW0U+gT40BY6VW9a6na0rbWJsiM5IQ7JbihLZGQpZwDz3VN9ukeitaAvbu255x40Bs0qt6H1Ozqyym5MR3YrYecZ2OkEkoUUk8d3FNa6pj6XiQX5Ed6QmXLRESlrGQpecHn2UBZKVTn9bRo2pI9idhyhc32u2S0nCvRzjJPd762Ltqo26zTbk7bJSo8RClubVIPweo4PWgLTSonTN1TfbFBujTLrDctoOpbd+EAemcVLCgFKUoBSlKAUpSgFKUoBSlKAUpSgFKUoBSlKAUpSgFKUoBSlKAUpSgFKUoBSlKAUpSgFKUoBSlKAUpSgFKUoBSlKAUpSgF function recordRoute(patch) {

  if (Object.keys(next).every(key => next[key] === state.route[key])) return false;
  state.undo.push({...state.route});
  state.redo = [];
  state.route = next;
  return true;
}

function historyMove(direction) {
  const from = direction === 'back' ? state.undo : state.redo;
  const to = direction === 'back' ? state.redo : state.undo;
  if (!from.length) return;
  to.push({...state.route});
  state.route = from.pop();
  const record = cases.get(state.route.caseId);
  if (record && isScope(state.route.view)) {
    const context = state.scopes[state.route.view];
    context.selected = record.id;
    if (!caseMatches(record,context)) clearCriteria(context);
  }
  if (state.route.view === 'policy' && !policyMatches(policies.get(state.route.docId))) {
    state.policy = {query:'',region:'',stage:'',kind:''};
  }
  render();
}
function revealCase(id,{scroll=false,tab='overview'}={}) {
  const record = cases.get(id);
  if (!record) return;
  const view = record.province ? 'china' : 'world';
  const changingView = state.route.view !== view;
  const context = state.scopes[view];
  if (!caseMatches(record,context)) clearCriteria(context);
  context.selected = id;
  recordRoute({view,caseId:id,caseTab:tab,focusedStep:'',panelDoc:'',panelClause:''});
  renderAndFocus('case-title');
  if (changingView) window.scrollTo(0,0);
  if (scroll) maybeScroll('case-inspector');

function showPolicy(id,clauseId='',inspector=false) {
  const policy = policies.get(id);
  if (!policy) return;
  const clause = policy.clauses.find(item=>item.id===clauseId);
  if (inspector && isScope(state.route.view)) {
    recordRoute({panelDoc:id,panelClause:clause?.id || policy.clauses[0]?.id});
    renderAndFocus('inline-policy-title');
    maybeScroll('case-inspector');

  }
  if (!policyMatches(policy)) state.policy = {query:'',region:'',stage:'',kind:''};
  const changingView = state.route.view !== 'policy';
  recordRoute({view:'policy',docId:id,clauseId:clause?.id || '',panelDoc:'',panelClause:''});
  renderAndFocus('policy-title');

function textMatches(text, query) {
  const tokens = String(query || '').trim().toLowerCase().split(/\s+/).filter(Boolean);
  const haystack = text.toLowerCase();
  return tokens.every(token=>haystack.includes(token));
}
function caseIndex(record) {

}

function caseMatches(record,context,{ignoreRegion=false}={}) {
  return (ignoreRegion || !context.region || regionOf(record) === context.region)
    && (!context.category || record.category === context.category)
    && (!context.step || record.steps.includes(context.step))
    && (!context.evidence || record.evidenceType === context.evidence)
    && (!context.featured || flagships.has(record.id))
    && (!context.cancer || record.cancers.some(name => (data.cancerGroups[context.cancer] || [context.cancer]).includes(name)))
    && textMatches(caseSearchFields.get(record.id),context.query);
}

function policyMatches(policy) {
  if (!policy) return false;
  const filter = state.policy;
  const regionMatch = !filter.region || filter.region === policy.region || (filter.region === '各地' && policy.region !== '全国');
  return regionMatch && (!filter.stage || policy.clauses.some(clause=>clause.stages.includes(filter.stage)))

function globalWorldPins(all,counts,context) {
  const groups = new Map();
  for (const record of all) {
    if (!groups.has(record.country) && record.coordinates?.length === 2) groups.set(record.country,record);
  }
  const europe = [...groups].filter(([,record])=>record.coordinates[0] > -12 && record.coordinates[0] < 33 && record.coordinates[1] > 35);
  const cluster = context.zoom < 1.6 && europe.length > 2;
  const points = [...groups].filter(([key])=>!cluster || !europe.some(([name])=>name===key)).map(([name,record])=>{
    const [lon,lat] = record.coordinates;
    const offsets = {CA:[-1.6,-1.6],US:[.6,.6],GB:[-1.5,0],UK:[-1.5,0],FR:[-.55,1],NL:[1,-.75],IT:[.85,.85]};
    const [x,y] = offsets[record.countryCode] || [0,0];
    return mapPin(name,record.countryCode,(lon+180)/3.6+x,(90-lat)/1.8+y,counts.get(name)||0,context.region===name,true);
  });
  if (cluster) {
    const count = europe.reduce((sum,[name])=>sum+(counts.get(name)||0),0);
    const contains = europe.some(([name])=>name===context.region);
    points.push('<button title="欧洲 · 查看各国标记" type="button" class="map-pin world-pin'+(contains?' focus-near':'')+'" style="--x:53%;--y:22%" data-action="zoom-europe" aria-label="欧洲，'+count+' 个案例，展开各国标记"><span aria-hidden="true">欧</span><span class="pin-count" aria-hidden="true">'+count+'</span></button>');
  }
  return points.join('');
}

function sourceTarget(policy,clause) {
  if (!clause) return policy.fullTextUrl;
  const url = clause.url || policy.fullTextUrl;
  const base = url.split('#')[0];
  if (clause.page) return base+'#page='+encodeURIComponent(clause.page);
  if (clause.find && !/\.(?:docx?|pdf)(?:[?#]|$)/i.test(base) && !base.includes('/onlineRead/')) {
    return base+'#:~:text='+encodeURIComponent(clause.find).replace(/-/g,'%2D');
  }
  return url;
}

  const groups = [['大陆对应案例',related.filter(record=>record.province)],['国际对照案例',related.filter(record=>record.country)]];

      (clause.page ? action('source','页内预览','data-id="'+attr(policy.id)+'" data-clause="'+attr(clause.id)+'"') : '')+

    '</li><li>'+anchor(data.mapSources.world,'世界陆地轮廓 · Natural Earth 1:110m Land')+
    '</li><li>'+anchor('https://developer.apple.com/design/human-interface-guidelines/designing-for-macos','Apple Human Interface Guidelines · macOS')+
    ' · '+anchor('https://developer.apple.com/design/human-interface-guidelines/split-views','分栏与检查器')+
    ' · '+anchor('https://developer.apple.com/documentation/technologyoverviews/adopting-liquid-glass','Liquid Glass')+'</li></ul></article>';
}
function keepEditing() {
  const focus = document.activeElement;
  if (!focus?.id || !/^(case-|policy-|map-|compact-nav|navigation-|compare-|fujian-tab-)/.test(focus.id)) return;
  return {id:focus.id,start:focus.selectionStart,end:focus.selectionEnd};
}
function render() {
  const cursor = keepEditing();
  const catalogScroll = document.querySelector('.policy-list')?.scrollTop;
  const view = state.route.view;
  renderNav();
  const routes={guide:guidePage,fujian:fujianPage,policy:policyPage,compare:comparePage,method:methodPage};
  const page = isScope(view) ? casesPage(view) : routes[view]();
  byId('screen').innerHTML = '<div class="screen-inner">'+page+
    '<footer class="attribution">癌症患者营养全周期管理 · 公开资料核验至 '+safe(date(guide.updateDate))+'</footer></div>';
  if (isScope(view)) applyMapTransform(state.scopes[view]);
  if (catalogScroll && view==='policy') document.querySelector('.policy-list').scrollTop = catalogScroll;
  if (cursor) {
    const next = byId(cursor.id);
    next?.focus({preventScroll:true});
    if (cursor.start !== null && cursor.start !== undefined) next?.setSelectionRange?.(cursor.start,cursor.end);
  }
}
let mapDrag = null;
function applyMapTransform(context) {
  const view = byId('map-viewport');
  const layer = byId('map-layer');
  if (!layer || !view) return;
  const maxX = view.clientWidth*(context.zoom-1)/2;
  const maxY = view.clientHeight*(context.zoom-1)/2;
  context.x = Math.max(-maxX, Math.min(maxX,context.x));
  context.y = Math.max(-maxY, Math.min(maxY,context.y));
  layer.style.transform = 'translate('+context.x+'px,'+context.y+'px) scale('+context.zoom+')';
  layer.style.setProperty('--inverse-scale',String(1/context.zoom));
}
function centerRegion(context,region) {
  const viewport = byId('map-viewport');
  if (!viewport || !region || context.zoom === 1) return;
  const place = state.route.view === 'china' ? data.regions.find(item=>item.name===region)?.at :
    byScope.world.find(record=>record.country===region)?.coordinates?.map((value,index)=>index ? (90-value)/1.8 : (value+180)/3.6);
  if (!place) return;
  context.x = (.5-place[0]/100)*viewport.clientWidth*context.zoom;
  context.y = (.5-place[1]/100)*viewport.clientHeight*context.zoom;
}
function setZoom(context,eventName) {
  const before = context.zoom;
  if (eventName==='zoom-reset') { context.zoom=1; context.x=0; context.y=0; }
  if (eventName==='zoom-in') context.zoom=Math.min(3,context.zoom+.35);
  if (eventName==='zoom-out') context.zoom=Math.max(1,context.zoom-.35);
  if (eventName==='zoom-in' && before===1) centerRegion(context,context.region || regionOf(cases.get(state.route.caseId) || {}));
  if (before>1 && ['zoom-in','zoom-out'].includes(eventName)) {
    context.x *= context.zoom/before;
    context.y *= context.zoom/before;
  }
  if (eventName==='zoom-europe') {
    context.zoom=2.35;
    const view = byId('map-viewport');
    context.x = view ? -view.clientWidth*.07 : 0;
    context.y = view ? view.clientHeight*.56 : 0;
  }
  render();
}
function toggleCompare(id) {
  if (!cases.has(id)) return;
  if (state.compare.includes(id)) {
    state.compare = state.compare.filter(item=>item!==id);
    announce('已移出对比');
  } else if (state.compare.length<3) {
    state.compare = [...state.compare,id];
    announce('已加入案例对比');
  } else {
    announce('对比最多可选择三个案例');
    const location = document.querySelector('.inspector-content');
    if (location && !location.querySelector('.compare-limit')) {
      location.insertAdjacentHTML('beforeend','<div class="effect-note compare-limit" role="status">已选满 3 个案例，可在对比台移出后继续添加。</div>');
    }
    return;
  }
  render();
}
function searchItems(query) {
  if (!query.trim()) {
    const popular = data.policies.slice(0,3).map(policy=>({type:'policy',id:policy.id,title:policy.title,meta:words([policy.region,policy.type])}));
    return [...(initialChina?[initialChina]:[]),...byScope.china.slice(0,2)].map(record=>({type:'case',id:record.id,title:record.title,meta:displayTitle(record)})).concat(popular);
  }
  const records = [...cases.values()].filter(record=>textMatches(caseSearchFields.get(record.id),query)).map(record=>({type:'case',id:record.id,title:record.title,meta:displayTitle(record),score:textMatches(record.title+' '+record.institution,query)?7:2}));
  const docs = data.policies.filter(policy=>textMatches(policyIndex(policy),query)).map(policy=>({type:'policy',id:policy.id,title:policy.title,meta:words([policy.region,policy.type,policy.number]),score:textMatches(policy.title+' '+policy.number,query)?9:1}));
  const clauses = data.policies.flatMap(policy=>policy.clauses.filter(clause=>textMatches([clause.title,clause.locator,clause.summary,clause.find].join(' '),query))
    .map(clause=>({type:'clause',id:policy.id,clause:clause.id,title:words([clause.locator,clause.title]),meta:policy.title,score:textMatches(clause.title+' '+clause.locator,query)?8:3})));
  return [...records,...docs,...clauses].sort((a,b)=>b.score-a.score).slice(0,28);
}
function searchRender() {
  const input = byId('global-query');
  const results = searchItems(input.value);
  state.searchResults = results;
  state.searchIndex = Math.max(0,Math.min(state.searchIndex,results.length-1));
  byId('search-results').innerHTML = results.length ? results.map((item,index)=>action('search-hit',
    symbol(item.type==='case'?'pin':item.type==='clause'?'link':'doc')+'<span class="row-text"><strong>'+safe(item.title)+'</strong><small>'+safe(item.meta)+'</small></span>'+
    badge(item.type==='case'?'案例':item.type==='clause'?'条款':'文件','blue'),
    'data-index="'+index+'" aria-current="'+press(index===state.searchIndex)+'"','result-row')).join('') :
    '<p class="result-empty">未找到匹配材料。可试试省份名、机构名或更短的关键词。</p>';
}
function openSearch() {
  const dialog = byId('search-dialog');
  if (dialog.open) return;
  state.searchIndex = 0;
  byId('global-query').value='';
  searchRender();
  dialog.showModal();
  byId('global-query').focus();
}
function pickSearch(index) {
  const result = state.searchResults[index];
  if (!result) return;
  byId('search-dialog').close();
  if (result.type === 'case') revealCase(result.id,{scroll:true});
  else showPolicy(result.id,result.clause);
}
let sourceOpener;
function openSource(id,clauseId,opener) {
  const policy = policies.get(id);
  if (!policy) return;
  const clause = clauseId ? policy.clauses.find(item=>item.id===clauseId) : null;
  sourceOpener = opener;
  const target = clause ? sourceTarget(policy,clause) : policy.previewUrl;
  byId('source-title').textContent = words([policy.title,clause?.locator]);
  byId('source-link').href = clause ? target : policy.fullTextUrl;
  byId('source-frame').src = target;
  byId('source-dialog').showModal();
}
byId('source-dialog').addEventListener('close',()=>{
  byId('source-frame').removeAttribute('src');
  sourceOpener?.focus({preventScroll:true});
});
byId('search-dialog').querySelector('form').addEventListener('submit',event=>{
  if (event.submitter?.value==='close') return;
  event.preventDefault();
  pickSearch(state.searchIndex);
});
byId('global-query').addEventListener('input',()=>{
  state.searchIndex = 0;
  searchRender();
});
byId('global-query').addEventListener('keydown',event=>{
  if (event.key==='Enter') {event.preventDefault(); pickSearch(state.searchIndex); return;}
  if (!['ArrowUp','ArrowDown'].includes(event.key) || !state.searchResults.length) return;
  event.preventDefault();
  state.searchIndex = (state.searchIndex+(event.key==='ArrowDown'?1:-1)+state.searchResults.length)%state.searchResults.length;
  searchRender();
  byId('search-results').querySelector('[aria-current="true"]')?.scrollIntoView({block:'nearest'});
});

document.addEventListener('click',async event=>{
  const control = event.target.closest('[data-action]');
  if (!control) return;
  const options = control.dataset;
  const context = state.scopes[state.route.view];
  switch (options.action) {
    case 'view': setView(options.view); break;
    case 'guide-section': byId('guide-'+options.section)?.scrollIntoView({block:'start'}); break;
    case 'fujian-map': openChina({region:'福建'}); break;
    case 'show-flagships': openChina({featured:true}); break;
    case 'flagship-filter': context.featured=!context.featured; syncFilterResults(); renderAndFocus('case-flagship'); break;
    case 'fujian-tab': state.fujianTab=options.tab; renderAndFocus('fujian-tab-'+options.tab); break;
    case 'share-section': {
      const url = new URL('#'+options.view,location.href);
      try { await navigator.clipboard.writeText(url.href); control.textContent='已复制链接'; }
      catch { window.prompt('复制本节链接',url.href); }
      break;
    }
    case 'sidebar': state.showSidebar=!state.showSidebar; renderNav(); if (context) applyMapTransform(context); break;
    case 'present': state.presentation=!state.presentation; renderNav(); if (context) applyMapTransform(context); break;
    case 'back': case 'forward': historyMove(options.action); break;
    case 'search': openSearch(); break;
    case 'search-hit': pickSearch(Number(options.index)); break;
    case 'mode': context.mode=options.mode; render(); break;
    case 'case-more': context.moreFilters=!context.moreFilters; renderAndFocus('case-more'); break;
    case 'clear-case': clearCriteria(context); syncFilterResults(); render(); break;
    case 'clear-policy': state.policy={query:'',region:'',stage:'',kind:''}; render(); break;
    case 'map-region': openCasesForRegion(options.region); break;
    case 'zoom-in': case 'zoom-out': case 'zoom-reset': case 'zoom-europe': setZoom(context,options.action); break;
    case 'case': revealCase(options.id,{scroll:true}); break;
    case 'case-tab':
      state.route.caseTab=options.tab;
      state.route.focusedStep=options.step||'';
      renderAndFocus('case-tab-'+options.tab);
      if (options.step) document.querySelector('.timeline .marked')?.scrollIntoView({block:'nearest'});
      break;
    case 'return-case': recordRoute({panelDoc:'',panelClause:'',caseTab:'links'}); renderAndFocus('case-title'); break;
    case 'inline-policy': showPolicy(options.id,options.clause,true); break;
    case 'policy': showPolicy(options.id,options.clause); break;
    case 'policy-clause': recordRoute({docId:options.id,clauseId:options.clause}); render(); break;
    case 'toggle-compare': toggleCompare(options.id); break;
    case 'compare-preset': state.compare=options.set.split('|').filter(id=>cases.has(id)).slice(0,3); render(); break;
    case 'source': openSource(options.id,options.clause,control); break;
    case 'close-source': byId('source-dialog').close(); break;
    case 'copy':
      try { await navigator.clipboard.writeText(options.text); control.textContent='已复制'; }
      catch { control.textContent='可选中上方查找词'; }
      break;
  }
});
document.addEventListener('input',event=>{
  if (event.target.id==='case-query' && isScope(state.route.view)) {
    state.scopes[state.route.view].query = event.target.value;
    syncFilterResults();
    render();
  }
  if (event.target.id==='policy-query') {
    state.policy.query=event.target.value;
    document.querySelector('.policy-list').scrollTop=0;
    render();
  }
});
document.addEventListener('change',event=>{
  const control = event.target;
  if (control.id==='compact-nav') {setView(control.value);return;}
  if (control.id==='compare-missing') {state.compareMissing=control.checked;render();return;}
  const [prefix,key]=control.id.split('-');
  if (prefix==='case' && ['region','category','step','evidence','cancer'].includes(key) && isScope(state.route.view)) {
    const context = state.scopes[state.route.view];
    context[key]=control.value;
    if (key==='region') centerRegion(context,control.value);
    syncFilterResults();
    render();
  }
  if (prefix==='policy' && ['region','stage','kind'].includes(key)) {
    state.policy[key]=control.value;
    render();
  }
});
byId('screen').addEventListener('pointerdown',event=>{
  const surface = event.target.closest('#map-viewport');
  const context = state.scopes[state.route.view];
  if (!surface || !context || context.zoom<=1 || event.button!==0 || event.target.closest('button')) return;
  surface.setPointerCapture(event.pointerId);
  mapDrag = {surface,context,startX:event.clientX,startY:event.clientY,x:context.x,y:context.y};
  surface.classList.add('dragging');
});
byId('screen').addEventListener('pointermove',event=>{
  if (!mapDrag) return;
  const {context,startX,startY,x,y}=mapDrag;
  context.x=x+event.clientX-startX;
  context.y=y+event.clientY-startY;
  applyMapTransform(context);
});
for (const name of ['lostpointercapture','pointerup','pointercancel']) {
  byId('screen').addEventListener(name,()=>{
    mapDrag?.surface.classList.remove('dragging');
    mapDrag = null;
  });
}
document.addEventListener('keydown',event=>{
  if ((event.metaKey||event.ctrlKey) && event.key.toLowerCase()==='k' && !byId('source-dialog').open) {
    event.preventDefault();
    openSearch();
    return;
  }
  if (event.target.id!=='map-viewport' || !isScope(state.route.view)) return;
  const context = state.scopes[state.route.view];
  if (event.key==='+' || event.key==='=') {event.preventDefault();setZoom(context,'zoom-in');return;}
  if (event.key==='-') {event.preventDefault();setZoom(context,'zoom-out');return;}
  if (event.key==='Home') {event.preventDefault();setZoom(context,'zoom-reset');return;}
  if (context.zoom<=1) return;
  const delta = {ArrowUp:[0,35],ArrowDown:[0,-35],ArrowLeft:[35,0],ArrowRight:[-35,0]}[event.key];
  if (!delta) return;
  event.preventDefault();
  context.x += delta[0];
  context.y += delta[1];
  applyMapTransform(context);
});
window.addEventListener('resize',()=>{
  if (isScope(state.route.view)) applyMapTransform(state.scopes[state.route.view]);
});
window.addEventListener('hashchange',()=>setView(viewFromLink()));
for (const element of document.querySelectorAll('i[data-icon]')) {
  element.outerHTML=symbol(element.dataset.icon);
}
render();

function guideReference(ref) {
  if (ref.type==='source') return anchor(ref.url,ref.label,'button');
  const routes = {
    case:['case','data-id'], policy:['policy','data-id'], view:['view','data-view'], section:['guide-section','data-section']
  };
  const [operation,attribute] = routes[ref.type];
  return action(operation,safe(ref.label),attribute+'="'+attr(ref.id)+'"'+(ref.clause?' data-clause="'+attr(ref.clause)+'"':''));
}
function guideReferences(refs) {
  return refs?.length?'<div class="actions">'+refs.map(guideReference).join('')+'</div>':'';
}
function shareButton(view) {
  if (!['https:','http:'].includes(location.protocol)) return '';
  return action('share-section',symbol('link')+'复制本节链接','data-view="'+view+'"','button');
}
function guideThesis(title,text,buttons='') {
  return '<section class="pane guide-thesis"><div><h2>'+safe(title)+'</h2><p>'+safe(text)+'</p></div>'+(buttons?'<div class="actions">'+buttons+'</div>':'')+'</section>';
}
function flagshipSection() {
  return '<section id="guide-flagships" class="guide-block" aria-label="中国大陆标志性案例"><div class="guide-section-head"><div><h2>中国大陆标志性案例</h2><p>'+safe(guide.flagshipIntro)+'</p></div>'+
    action('show-flagships',symbol('star')+'在地图查看','', 'button primary')+'</div><div class="guide-cards featured-cards">'+
    guide.flagships.map(entry=>{
      const record=cases.get(entry.id);
      return '<article class="pane guide-card">'+badge('★ '+entry.lens,'amber')+'<h3>'+safe(record.institution)+'</h3><p>'+safe(entry.why)+'</p>'+
       '<p class="meta">'+safe(entry.bounds)+'</p>'+guideReferences([{type:'case',id:entry.id,label:'查看案例与证据'}])+'</article>';
    }).join('')+'</div></section>';
}
function guidePage() {
  const content=guide.overview;
  return head(content.title,content.subtitle,[[byScope.china.length,'大陆案例'],[data.policies.length,'中国政策文件'],[flagships.size,'标志性案例']])+

      '<article class="pane guide-card"><h3>'+safe(entry.title)+'</h3><p>'+safe(entry.detail)+'</p>'+guideReferences([entry.target])+'</article>').join('')+'</div></section>'+
    '<section id="guide-cycle" class="guide-block" aria-label="全周期照护路径"><div class="guide-section-head"><h2>全周期照护路径</h2></div><ol class="pane guide-cycle">'+
    content.cycle.map(entry=>'<li><h3>'+safe(entry.label)+'</h3><p>'+safe(entry.summary)+'</p>'+guideReferences(entry.refs)+'</li>').join('')+'</ol></section>'+
    flagshipSection()+'<p class="guide-footnote">'+safe(content.use)+'</p>';
}
function fujianActions(content) {
  return '<div class="guide-cards action-cards">'+content.actions.map(entry=>'<article class="pane guide-card">'+badge(entry.layer,'blue')+
    '<h3>'+safe(entry.title)+'</h3><dl><dt>福建可先做</dt><dd>'+safe(entry.local)+'</dd><dt>从案例借鉴</dt><dd>'+safe(entry.transfer)+
    '</dd><dt>落地前核对</dt><dd>'+safe(entry.limit)+'</dd></dl>'+guideReferences(entry.refs)+'</article>').join('')+'</div>'+

function fujianPilot(content) {
  return '<ol class="pane guide-cycle">'+content.pilot.map(entry=>'<li>'+badge(entry.label,'blue')+'<h3>'+safe(entry.title)+'</h3><p>'+safe(entry.detail)+'</p></li>').join('')+'</ol>';
}
function fujianMetrics(content) {
  return '<div class="guide-cards action-cards">'+content.metrics.map(entry=>'<article class="pane guide-card"><h3>'+safe(entry.name)+'</h3><p class="metric-definition">'+
    safe(entry.definition)+'</p><p class="meta">'+safe(entry.note)+'</p></article>').join('')+'</div>';
}
function fujianPage() {
  const content=guide.fujian;
  const tabs={actions:'优先措施',pilot:'90 天试点',metrics:'看哪些指标'};
  const body=state.fujianTab==='pilot'?fujianPilot(content):state.fujianTab==='metrics'?fujianMetrics(content):fujianActions(content);
  return head(content.title,content.subtitle,[],'地方应用')+guideThesis('建议的起点',content.thesis,
    action('fujian-map',symbol('map')+'查看福建案例','','button primary')+shareButton('fujian'))+
    '<section class="guide-block" aria-label="福建已有基础"><div class="guide-section-head"><h2>福建已有基础</h2></div><div class="guide-cards">'+
    content.foundation.map(entry=>'<article class="pane guide-card"><h3>'+safe(entry.title)+'</h3><p>'+safe(entry.detail)+'</p>'+guideReferences(entry.refs)+'</article>').join('')+'</div></section>'+
    '<section class="guide-block" aria-label="福建落地方案"><div class="guide-section-head"><h2>福建落地方案</h2><div class="segmented" aria-label="落地方案视图">'+Object.entries(tabs).map(([id,label])=>
      action('fujian-tab',safe(label),'id="fujian-tab-'+id+'" data-tab="'+id+'" aria-controls="fujian-content" aria-pressed="'+press(id===state.fujianTab)+'"','')).join('')+'</div></div>'+
    '<div id="fujian-content">'+body+'</div></section><p class="guide-footnote">'+safe(content.guardrail)+'</p>';
}
